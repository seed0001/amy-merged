<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tagging Studio</title>
<style>
  :root {
    --bg: #101216; --panel: #181b21; --panel2: #1f232b; --line: #2a2f39; --text: #e7e9ee; --dim: #9099a8;
    --accent: #7c8cff; --good: #4fd08a; --warn: #f2b84b; --bad: #f0706a;
    --c1: #7c8cff; --c2: #4fd0c0; --c3: #f2b84b; --c4: #e78bd0; --c5: #8fd05a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .sub { color: var(--dim); font-size: 12.5px; }
  .pill { padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--panel2); color: var(--dim); }
  .pill.running { background: #17352a; color: var(--good); } .pill.paused { background: #3a3018; color: var(--warn); }
  .pill.finished { background: #1c2647; color: var(--accent); } .pill.bad { background: #3b1e1d; color: var(--bad); }
  button { margin-left: auto; background: var(--accent); color: #0b0d12; border: 0; border-radius: 8px; padding: 8px 16px; font: inherit; font-weight: 650; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); margin: 0 0 10px; font-weight: 650; }
  .wide { grid-column: 1 / -1; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--panel2); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 20px; font-weight: 650; } .stat span { color: var(--dim); font-size: 12px; }
  .bar { height: 10px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s; }
  .passes { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 12px; }
  .pass { font-size: 12.5px; } .pass .name { display: flex; justify-content: space-between; color: var(--dim); margin-bottom: 4px; gap: 8px; }
  .note { margin-top: 10px; color: var(--warn); font-size: 13px; }
  .feed { display: flex; flex-direction: column; gap: 10px; }
  .item { background: var(--panel2); border-radius: 10px; padding: 10px 12px; border-left: 3px solid var(--line); overflow-wrap: anywhere; }
  .item.done { border-left-color: var(--good); }
  .who { font-weight: 650; margin-right: 6px; } .said { color: var(--text); }
  .layers { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .layer { display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }
  .layer .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); width: 62px; flex: none; }
  .chip { font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: #262b36; border: 1px solid var(--line); white-space: nowrap; }
  .p0 .chip { border-color: color-mix(in srgb, var(--c1) 55%, transparent); } .p1 .chip { border-color: color-mix(in srgb, var(--c2) 55%, transparent); }
  .p2 .chip { border-color: color-mix(in srgb, var(--c3) 55%, transparent); } .p3 .chip { border-color: color-mix(in srgb, var(--c4) 55%, transparent); }
  .p4 .chip { border-color: color-mix(in srgb, var(--c5) 55%, transparent); }
  .claim { font-size: 12.5px; padding: 2px 0 2px 68px; color: #cfd4de; } .claim em { color: var(--dim); font-style: normal; }
  .tally { margin-bottom: 14px; } .tally h3 { font-size: 12.5px; margin: 0 0 6px; font-weight: 650; }
  .row { display: grid; grid-template-columns: minmax(0, 150px) 1fr 38px; gap: 8px; align-items: center; font-size: 12px; margin: 2px 0; }
  .row .n { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; } .row .k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .bar { height: 7px; } .empty { color: var(--dim); font-size: 13px; padding: 8px 0; }
  .fact { background: var(--panel2); border-radius: 8px; padding: 8px 10px; margin-bottom: 7px; font-size: 12.5px; overflow-wrap: anywhere; }
  .fact .from { color: var(--dim); margin-top: 3px; } .keep { color: var(--good); } .moment { color: var(--warn); } .not_a_fact { color: var(--bad); }
</style>
</head>
<body>
<header>
  <div><h1>Tagging Studio</h1><div class="sub" id="model">waiting for the tagger…</div></div>
  <span class="pill" id="state">idle</span>
  <button id="toggle" disabled>Pause</button>
</header>
<main>
  <section class="wide">
    <h2>Progress</h2>
    <div class="stats" id="stats"></div>
    <div class="bar"><i id="overall" style="width:0"></i></div>
    <div class="passes" id="passes"></div>
    <div class="note" id="note"></div>
  </section>
  <section>
    <h2>Lines as they're tagged</h2>
    <div class="feed" id="feed"><div class="empty">Nothing tagged yet.</div></div>
  </section>
  <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
    <section><h2>Facts it pulled out</h2><div id="claims"><div class="empty">None yet.</div></div></section>
    <section><h2>What's turning up</h2><div id="tallies"><div class="empty">Nothing yet.</div></div></section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const dur = (s) => s == null ? '—' : s < 90 ? `${Math.round(s)}s` : s < 5400 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`;
const nice = (v) => String(v).replace(/_/g, ' ');
const LABEL = { address_act: ['Address', 'Act'], subject_knowledge: ['Subject', 'Facts'], feeling_stance_charge: ['Feeling', 'Stance', 'Charge'], call_form: ['Call', 'Form'], links: ['Links'] };

function chipsFor(pass, t) {
  const g = (label, values) => ({ label, values: values.filter((v) => v != null && v !== '' && v !== 'none' && v !== 'nothing') });
  if (pass === 'address_act') return [g('Address', [`to ${nice(t.to)}`, `wants ${nice(t.wants)}`, nice(t.place)]), g('Act', (t.acts || []).map(nice))];
  if (pass === 'subject_knowledge') return [g('Subject', [...(t.about || []).map((a) => `about ${nice(a)}`), ...(t.bot_part || []).map((a) => `her ${nice(a)}`), ...(t.field || []).map(nice), ...(t.topics || []).map((x) => `“${x}”`)])];
  if (pass === 'feeling_stance_charge') return [
    g('Feeling', [...(t.feelings || []).map((f) => `${f.feeling} ${'●'.repeat(f.strength)}`), t.swearing && t.swearing !== 'none' ? `swearing: ${nice(t.swearing)}` : null]),
    g('Stance', [t.distance !== 'neither' ? nice(t.distance) : null, t.treats_as && t.treats_as !== 'not_about_bot' ? `as ${nice(t.treats_as)}` : null, ...(t.trust || []).map(nice), nice(t.authority || 'none'), t.standing && t.standing !== 'none' ? `${t.standing} she's real` : null]),
    g('Charge', (t.charge || []).map((c) => `${nice(c.charge)} ${'●'.repeat(c.strength)}`))];
  if (pass === 'call_form') return [g('Call', (t.calls || []).map(nice)), g('Form', [t.shape, ...(t.has || []).map((h) => `has ${nice(h)}`), t.leans !== 'stands_alone' ? nice(t.leans) : null, t.transcription !== 'clean' ? nice(t.transcription) : null, t.register !== 'plain' ? t.register : null])];
  if (pass === 'links') return [g('Links', [t.answers_id != null ? `answers #${t.answers_id}` : null, t.continues_id != null ? `continues #${t.continues_id}` : null, `thread: ${nice(t.thread)}`, t.last_reply && t.last_reply !== 'bot_had_not_spoken' ? `her last reply: ${nice(t.last_reply)}` : null])];
  return [];
}

function render(s) {
  const st = s.status || {};
  const state = s.paused && st.state === 'running' ? 'pausing' : (st.state || 'idle');
  $('state').textContent = state;
  $('state').className = 'pill ' + (state === 'running' || state === 'starting' ? 'running' : state === 'paused' || state === 'pausing' ? 'paused' : state === 'finished' ? 'finished' : state === 'not responding' ? 'bad' : '');
  $('model').textContent = st.model ? `${st.model} · ${st.lines ?? 0} lines × ${(st.passes || []).length} passes` : 'waiting for the tagger…';
  const live = ['running', 'starting', 'paused'].includes(st.state);
  $('toggle').disabled = !live; $('toggle').textContent = s.paused ? 'Resume' : 'Pause';
  const pct = st.total ? 100 * st.done / st.total : 0;
  $('overall').style.width = pct.toFixed(1) + '%';
  const perLine = st.seconds_per_tag != null ? st.seconds_per_tag * (st.passes || []).length : null;
  const stats = [[`${pct.toFixed(1)}%`, 'done'], [`${s.lines_complete}`, `of ${st.lines ?? '—'} lines fully tagged`], [`${st.done ?? 0}`, `of ${st.total ?? '—'} tags made`],
    [perLine != null ? `${perLine.toFixed(1)}s` : '—', 'per line, all layers'], [dur(st.eta_seconds), 'left at this pace'], [`${st.failed_windows ?? 0}`, 'groups failed or came back short']];
  $('stats').replaceChildren(...stats.map(([b, t]) => { const d = el('div', 'stat'); d.append(el('b', null, b), el('span', null, t)); return d; }));
  $('passes').replaceChildren(...(s.passes || []).map((p, i) => {
    const done = (st.per_pass || {})[p.name] ?? 0, d = el('div', 'pass'), n = el('div', 'name');
    n.append(el('span', null, `Layers ${p.layers}`), el('span', null, `${done}`));
    const bar = el('div', 'bar'), fill = el('i'); fill.style.width = (st.lines ? 100 * done / st.lines : 0).toFixed(1) + '%'; fill.style.background = `var(--c${i + 1})`; bar.append(fill);
    d.append(n, bar); return d;
  }));
  $('note').textContent = st.note || '';

  const order = (s.passes || []).map((p) => p.name);
  $('feed').replaceChildren(...(s.recent.length ? s.recent.map((line) => {
    const item = el('div', 'item' + (Object.keys(line.passes).length === order.length ? ' done' : ''));
    const head = el('div'); head.append(el('span', 'who', line.speaker), el('span', 'said', line.text.length > 320 ? line.text.slice(0, 320) + '…' : line.text)); item.append(head);
    const layers = el('div', 'layers');
    order.forEach((name, i) => { const t = line.passes[name]; if (!t) return;
      for (const g of chipsFor(name, t)) { if (!g.values.length) continue; const row = el('div', `layer p${i}`); row.append(el('span', 'lbl', g.label), ...g.values.map((v) => el('span', 'chip', v))); layers.append(row); }
      if (name === 'subject_knowledge') for (const c of t.claims || []) { const cl = el('div', 'claim'); cl.append(el('span', c.keep, '◆ '), document.createTextNode(c.text + ' '), el('em', null, `· ${nice(c.kind)} · ${nice(c.when)} · ${nice(c.sure)}${c.denied ? ' · denied' : ''} · ${nice(c.keep)}`)); layers.append(cl); }
    });
    item.append(layers); return item;
  }) : [el('div', 'empty', 'Nothing tagged yet.')]));

  $('claims').replaceChildren(...(s.claims.length ? s.claims.map((c) => { const f = el('div', 'fact'); const top = el('div'); top.append(el('span', c.keep, '◆ '), document.createTextNode(c.text));
    f.append(top, el('div', 'from', `${nice(c.kind)} · ${nice(c.keep)} · from ${c.speaker}: “${c.said}”`)); return f; }) : [el('div', 'empty', 'None yet.')]));

  const tallies = Object.entries(s.counts).filter(([, v]) => v.length);
  $('tallies').replaceChildren(...(tallies.length ? tallies.map(([title, rows]) => { const t = el('div', 'tally'); t.append(el('h3', null, title)); const max = Math.max(...rows.map((r) => r[1]));
    for (const [k, n] of rows) { const r = el('div', 'row'), bar = el('div', 'bar'), fill = el('i'); fill.style.width = (100 * n / max) + '%'; bar.append(fill); r.append(el('span', 'k', nice(k)), bar, el('span', 'n', n)); t.append(r); }
    return t; }) : [el('div', 'empty', 'Nothing yet.')]));
}

let paused = false;
async function tick() { try { const s = await (await fetch('/api/state')).json(); paused = s.paused; render(s); } catch { $('state').textContent = 'studio not reachable'; $('state').className = 'pill bad'; } }
$('toggle').addEventListener('click', async () => { await fetch(paused ? '/api/resume' : '/api/pause', { method: 'POST' }); tick(); });
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
